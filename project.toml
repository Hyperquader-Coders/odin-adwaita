# What odin-adwaita is and needs: build is what a program on it needs, test what only its own
# tests and checks need. house-rules docs/PROJECT_TOML.md has the layout.
[project]
schema = "amber-project-1"
name = "odin-adwaita"
license = "LGPL-2.1-or-later"
kind = "binding"
summary = "Odin bindings for libadwaita, generated with runic"
tags = [
  "ai-assisted",
  "bindings",
  "libadwaita",
  "linux",
  "odin",
  "runic",
]
collection = "adwaita"
steps = [
  "init-modules",
  "check-no-agent-files",
  "lint",
  "check",
  "test",
  "check-own-libs",
]

[siblings.AMBER_ROOT]
odin-glib = "https://github.com/Hyperquader-Coders/odin-glib"
odin-cairo = "https://github.com/Hyperquader-Coders/odin-cairo"
odin-pango = "https://github.com/Hyperquader-Coders/odin-pango"
odin-graphene = "https://github.com/Hyperquader-Coders/odin-graphene"
odin-gdk-pixbuf = "https://github.com/Hyperquader-Coders/odin-gdk-pixbuf"
odin-gtk4 = "https://github.com/Hyperquader-Coders/odin-gtk4"

[build]
# The library the binding is generated from, and the suite's GTK the tests run on.
packages = [
  "libadwaita-1-dev",
  "libgtk-4-dev",
  "amber-gtk4",
]
lib = [
  "adwaita",
]

[test]
packages = [
  "shellcheck",
  "shfmt",
]
