# Per-repo settings for scripts/api.sh and scripts/cheatsheet.sh (POSIX sh).
# Everything else in those two scripts is identical in every binding.
REPO=odin-adwaita
PACKAGES="adwaita"
COLLECTION=adwaita
DOC_COLLECTIONS="-collection:adwaita=. -collection:glib=${AMBER_ROOT:-..}/odin-glib -collection:cairo=${AMBER_ROOT:-..}/odin-cairo -collection:pango=${AMBER_ROOT:-..}/odin-pango -collection:graphene=${AMBER_ROOT:-..}/odin-graphene -collection:pixbuf=${AMBER_ROOT:-..}/odin-gdk-pixbuf -collection:gtk4=${AMBER_ROOT:-..}/odin-gtk4"
INTRO='The short form is the [cheat sheet](CHEATSHEET.md); the rules of the bindings are in the
[README](../README.md) and [PATCHED.md](PATCHED.md).'
ALIASES="adw=adwaita"
DEDUP=1
