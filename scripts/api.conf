# Per-repo settings for scripts/api.sh and scripts/cheatsheet.sh (POSIX sh).
# Everything else in those two scripts is identical in every binding.
REPO=odin-adwaita
PACKAGES="adwaita"
COLLECTION=adwaita
DOC_COLLECTIONS="-collection:adwaita=. -collection:glib=../odin-glib -collection:cairo=../odin-cairo -collection:pango=../odin-pango -collection:graphene=../odin-graphene -collection:pixbuf=../odin-gdk-pixbuf -collection:gtk4=../odin-gtk4"
INTRO='The short form is the [cheat sheet](CHEATSHEET.md); the rules of the bindings are in the
[README](../README.md) and [PATCHED.md](PATCHED.md).'
ALIASES="adw=adwaita"
DEDUP=1
